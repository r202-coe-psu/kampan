name: kampan

x-app: &app
  image: ${REGISTRY_KAMPAN_IMAGE:?Set REGISTRY_KAMPAN_IMAGE to the image built by Jenkins}
  restart: unless-stopped
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - type: bind
      source: ${KAMPAN_STAGING_FILES_DIR:-/home/bomzyx/actions-runner/_work/kampan/deployment}
      target: /deployment
      bind:
        create_host_path: false
    - type: bind
      source: ${KAMPAN_CFG_FILE:?Set KAMPAN_CFG_FILE to the persistent staging config}
      target: /app/kampan-development.cfg
      read_only: true
      bind:
        create_host_path: false
  environment:
    KAMPAN_SETTINGS: /app/kampan-development.cfg
  networks:
    - staging
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    container_name: kampan-web-development
    ports:
      - "${KAMPAN_STAGING_PORT:-10060}:10060"
    command: /venv/bin/gunicorn -w 4 --bind 0.0.0.0:10060 --access-logfile - "kampan.web:create_app()"
    healthcheck:
      test:
        - CMD
        - /venv/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10060/', timeout=5)"
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  worker:
    <<: *app
    container_name: kampan-worker-development
    command: /venv/bin/kampan-worker

  controller:
    <<: *app
    container_name: kampan-controller-development
    command: /venv/bin/kampan-controller

networks:
  staging:
    external: true
    name: kampan_kampan-network
