<div class="flex items-center justify-between px-3 py-2">
  <span class="font-bold">การแจ้งเตือน</span>
  <form method="post" action="{{ url_for('car_reservation.notifications.read_all', organization_id=organization.id) }}">
    <button type="submit" class="btn btn-ghost btn-xs">อ่านทั้งหมด</button>
  </form>
</div>
<div class="max-h-96 overflow-y-auto">
  {% for notification in notifications %}
  {% include "/car_reservation/notifications/_item.html" %}
  {% else %}
  <p class="p-6 text-center text-sm text-base-content/60">ยังไม่มีการแจ้งเตือน</p>
  {% endfor %}
</div>
<a class="btn btn-ghost btn-sm btn-block mt-1" href="{{ url_for('car_reservation.notifications.index', organization_id=organization.id) }}">ดูทั้งหมด</a>
