{# ปุ่มปิดใช้งานรถ (POST) แสดงเฉพาะรถที่ยังใช้งานอยู่ #}
{% macro DeactivateButton(car, organization) %}
{% if car.status == 'active' %}
<form method="post" class="inline"
      action="{{ url_for('car_reservation.cars.deactivate', car_id=car.id, organization_id=organization.id) }}"
      onsubmit="return confirm('ปิดใช้งานรถ {{ car.license_plate }} ใช่หรือไม่');">
  {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
  <button type="submit" class="btn btn-sm btn-error btn-outline">
    <i class="ph ph-prohibit"></i> ปิดใช้งาน
  </button>
</form>
{% endif %}
{% endmacro %}
