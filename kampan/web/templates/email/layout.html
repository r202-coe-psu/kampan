<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; -webkit-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:16px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0;">
          <tr>
            <td style="background-color:{{ primary_color }}; padding:20px 28px; font-family:Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Arial, sans-serif; color:#ffffff;">
              <div style="font-size:13px; letter-spacing:1px; opacity:0.85;">{{ app_name }}</div>
              <div style="font-size:19px; font-weight:bold; line-height:1.4; margin-top:4px;">{{ subject }}</div>
            </td>
          </tr>
          {% if steps %}
          <tr>
            <td style="padding:24px 20px 4px; font-family:Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Arial, sans-serif;">
              {{ steps }}
            </td>
          </tr>
          {% endif %}
          <tr>
            <td style="padding:28px; font-family:Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Arial, sans-serif; font-size:15px; line-height:1.7; color:#1e293b;">
              {{ content }}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px; background-color:#f8fafc; border-top:1px solid #e2e8f0; font-family:Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Arial, sans-serif; font-size:12px; line-height:1.6; color:#64748b;">
              อีเมลนี้ส่งอัตโนมัติจากระบบ {{ app_name }} กรุณาอย่าตอบกลับอีเมลนี้
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
