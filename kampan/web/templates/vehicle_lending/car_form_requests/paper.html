{% extends '/vehicle_lending/base/default-car-page.html' %}

{% block title %}ใบขอใช้รถยนต์{% endblock %}
{% block dashboard_title %}ใบขอใช้รถยนต์{% endblock %}

{% block content %}
<div class="flex justify-end gap-2 mt-4 print:hidden">
  <a class="btn btn-outline" href="{{ url_for('vehicle_lending.car_form_requests.inbox', organization_id=organization.id) }}">กลับ</a>
  <button type="button" class="btn btn-primary" onclick="window.print()">
    <i class="ph ph-printer"></i> พิมพ์
  </button>
</div>
<div class="mt-4 bg-white text-black p-6 rounded-2xl shadow-sm">
  {# paper_html ถูก render ใน jinja sandbox แบบ autoescape แล้ว #}
  {{ paper_html|safe }}
</div>
{% endblock %}
